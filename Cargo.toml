[package]
name = "solana-debugger"
version = "0.1.0"
edition = "2021"

[dependencies]
solana-client = "1.18"
solana-sdk = "1.18"
solana-transaction-status = "1.18"
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
dirs = "5.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
object = "0.36"
gimli = "0.31"
flate2 = "1.0"
reqwest = { version = "0.12", features = ["blocking", "json"] }
url = "2.5"
